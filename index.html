<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Μια σημαντική ερώτηση 💗</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6e7, #fff0f6);
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 90%;
    max-width: 520px;
    background: rgba(255,255,255,0.95);
    padding: 35px 25px;
    border-radius: 30px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(255,80,140,0.2);
    position: relative;
    z-index: 2;
}

h1 {
    color: #ff4f8b;
    font-size: 30px;
    margin-top: 0;
}

.question {
    color: #444;
    font-size: 23px;
    font-weight: bold;
    min-height: 75px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.counter {
    color: #ff8bb5;
    font-size: 14px;
    margin-bottom: 15px;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    min-height: 70px;
    position: relative;
    margin-top: 15px;
}

button {
    border: none;
    padding: 15px 30px;
    border-radius: 50px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s;
}

#yes {
    background: #ff4f8b;
    color: white;
    box-shadow: 0 6px 15px rgba(255,79,139,0.3);
}

#yes:hover {
    transform: scale(1.1);
}

#no {
    background: #eeeeee;
    color: #555;
    position: relative;
}

#result {
    display: none;
}

.big-heart {
    font-size: 80px;
    animation: beat 1s infinite;
}

.result-title {
    color: #ff4f8b;
    font-size: 30px;
    font-weight: bold;
}

.result-text {
    color: #666;
    font-size: 18px;
}

.heart {
    position: fixed;
    bottom: -40px;
    z-index: 1;
    animation: floatUp linear forwards;
    pointer-events: none;
}

@keyframes floatUp {
    from {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

@keyframes beat {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.2);
    }
}
</style>
</head>

<body>

<div class="container" id="quiz">

    <h1>Μια σημαντική ερώτηση... 💗</h1>

    <div class="counter" id="counter">
        Ερώτηση 1 από 8
    </div>

    <div class="question" id="question">
        Με αγαπάς; 🥹❤️
    </div>

    <div class="buttons">

        <button id="yes">
            ΝΑΙ ❤️
        </button>

        <button id="no">
            ΟΧΙ 😈
        </button>

    </div>

</div>


<div class="container" id="result">

    <div class="big-heart">
        💗
    </div>

    <div class="result-title">
        ΤΟ ΗΞΕΡΑΑΑ 😭❤️
    </div>

<div class="result-title">
    Το ξέρω ότι με θες σαν τρελή, όπως κι εγώ 😏😜❤️
</div>

   <p>
        💕 💗 💕 💗 💕
    </p>

</div>


<script>

const questions = [

    "Με αγαπάς; 🥹❤️",

    "Με θες σαν τρελή; Γιατί εγώ ναι 😏❤️",

    "Με σκέφτεσαι όταν δεν μιλάμε; 💭💕",

    "Είμαι το αγαπημένο σου άτομο; 🫶",

    "Θα με αντέξεις για πολύ ακόμα; 😂❤️",

    "Είμαι σημαντικός/ή για σένα; 💗",

    "Με αγαπάς ΠΟΛΥ; 😭❤️",

    "Τελευταία ερώτηση... Θα πεις πάλι ΝΑΙ; 😏💕"

];


let currentQuestion = 0;

const question = document.getElementById("question");
const counter = document.getElementById("counter");

const yes = document.getElementById("yes");
const no = document.getElementById("no");

const quiz = document.getElementById("quiz");
const result = document.getElementById("result");


/* ΝΑΙ */

yes.addEventListener("click", function() {

    currentQuestion++;

    if (currentQuestion >= questions.length) {

        quiz.style.display = "none";

        result.style.display = "block";

        createHearts();

        return;
    }

    question.textContent = questions[currentQuestion];

    counter.textContent =
        "Ερώτηση " +
        (currentQuestion + 1) +
        " από " +
        questions.length;

    yes.style.transform =
        "scale(" +
        (1 + currentQuestion * 0.05) +
        ")";

});


/* ΟΧΙ */

function moveNo() {

    const maxX =
        window.innerWidth -
        no.offsetWidth -
        20;

    const maxY =
        window.innerHeight -
        no.offsetHeight -
        20;

    const x =
        Math.random() * maxX;

    const y =
        Math.random() * maxY;

    no.style.position = "fixed";

    no.style.left = x + "px";

    no.style.top = y + "px";
}


/* Υπολογιστής */

no.addEventListener("mouseover", moveNo);


/* Κινητό */

no.addEventListener("touchstart", function(event) {

    event.preventDefault();

    moveNo();

});


no.addEventListener("click", moveNo);


/* Καρδούλες */

function createHearts() {

    const hearts = [
        "❤️",
        "💕",
        "💗",
        "💖",
        "💓",
        "💘",
        "✨"
    ];

    for (let i = 0; i < 40; i++) {

        const heart =
            document.createElement("div");

        heart.className = "heart";

        heart.textContent =
            hearts[
                Math.floor(
                    Math.random() *
                    hearts.length
                )
            ];

        heart.style.left =
            Math.random() * 100 + "vw";

        heart.style.fontSize =
            (18 + Math.random() * 30) + "px";

        heart.style.animationDuration =
            (3 + Math.random() * 4) + "s";

        document.body.appendChild(heart);

        setTimeout(function() {

            heart.remove();

        }, 7000);
    }
}


/* Συνεχόμενες καρδούλες */

setInterval(function() {

    const heart =
        document.createElement("div");

    heart.className = "heart";

    const hearts = [
        "❤️",
        "💕",
        "💗",
        "✨"
    ];

    heart.textContent =
        hearts[
            Math.floor(
                Math.random() *
                hearts.length
            )
        ];

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.fontSize =
        (18 + Math.random() * 20) + "px";

    heart.style.animationDuration =
        (4 + Math.random() * 3) + "s";

    document.body.appendChild(heart);

    setTimeout(function() {

        heart.remove();

    }, 7000);

}, 800);

</script>

</body>
</html>
