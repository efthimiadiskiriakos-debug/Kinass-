<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Μια ερώτηση ❤️</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #ffd6e7, #ffeef5);
        overflow: hidden;
    }

    .box {
        background: white;
        width: 90%;
        max-width: 430px;
        padding: 35px 25px;
        border-radius: 25px;
        text-align: center;
        box-shadow: 0 10px 35px rgba(0,0,0,0.15);
    }

    h1 {
        color: #ff4f87;
        margin-bottom: 15px;
    }

    p {
        color: #555;
        font-size: 18px;
    }

    button {
        border: none;
        padding: 14px 28px;
        margin: 10px;
        border-radius: 15px;
        font-size: 18px;
        cursor: pointer;
        transition: 0.2s;
    }

    #yes {
        background: #ff4f87;
        color: white;
    }

    #yes:hover {
        transform: scale(1.1);
    }

    #no {
        background: #ddd;
        color: #333;
        position: relative;
    }

    .heart {
        font-size: 60px;
        animation: pulse 1s infinite;
    }

    @keyframes pulse {
        50% {
            transform: scale(1.15);
        }
    }

    #result {
        display: none;
    }
</style>
</head>

<body>

<div class="box" id="questionBox">

    <div class="heart">❤️</div>

    <h1>Μια σημαντική ερώτηση...</h1>

    <p id="question">
        Με αγαπάς; 🥹
    </p>

    <button id="yes">ΝΑΙ ❤️</button>
    <button id="no">ΟΧΙ 😭</button>

</div>


<div class="box" id="result">

    <div class="heart">💖</div>

    <h1>ΤΟ ΗΞΕΡΑ 😭❤️</h1>

    <p>
        Ήξερα ότι θα πεις ΝΑΙ 🥹
    </p>

    <p>
        Είσαι officially υποχρεωμένος/η να χαμογελάσεις τώρα. 😌
    </p>

</div>


<script>

const noButton = document.getElementById("no");
const yesButton = document.getElementById("yes");

noButton.addEventListener("mouseover", moveButton);
noButton.addEventListener("touchstart", moveButton);

function moveButton() {

    const maxX = window.innerWidth - noButton.offsetWidth - 20;
    const maxY = window.innerHeight - noButton.offsetHeight - 20;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    noButton.style.position = "fixed";
    noButton.style.left = x + "px";
    noButton.style.top = y + "px";
}

yesButton.addEventListener("click", function() {

    document.getElementById("questionBox").style.display = "none";
    document.getElementById("result").style.display = "block";

});

</script>

</body>
</html>
